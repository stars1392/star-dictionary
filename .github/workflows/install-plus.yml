name: Attach Star Dictionary Plus
on:
  push:
    paths:
      - 'star-dictionary-plus.js'
      - '.github/workflows/install-plus.yml'
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach enhancement script
        run: python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./star-dictionary-plus.js?v=1"></script>\n'
          if 'star-dictionary-plus.js' not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
      - name: Commit attachment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: enable Star Dictionary Plus"
          git push

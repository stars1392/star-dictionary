name: Attach Dictionary Fix
on:
  push:
    paths:
      - 'dictionary-fix.js'
      - '.github/workflows/attach-dictionary-fix.yml'
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach fix script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./dictionary-fix.js?v=2"></script>'
          if 'dictionary-fix.js' not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: load dictionary reliably on login"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/attach-dictionary-fix.yml || true
          git commit -m "chore: remove one-time attach workflow" || true
          git push || true

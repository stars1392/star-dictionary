<html lang="fa" dir="rtl">

<style>
:root{--bg:#f4f7f8;--card:#fff;--text:#17323a;--muted:#718096;--primary:#0f766e;--primary2:#14b8a6;--gold:#d59b18;--danger:#dc2626;--soft:#eef8f6;--border:#e5e7eb;--shadow:0 14px 40px #174e4a14;--glass:#ffffffd9}body.dark{--bg:#0b1418;--card:#142329;--text:#ecf7f5;--muted:#9db1b6;--soft:#19343a;--border:#294047;--shadow:0 18px 50px #0008;--glass:#142329e6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 2%,#d9fff7 0,transparent 27%),radial-gradient(circle at 92% 8%,#fff0bf 0,transparent 24%),linear-gradient(135deg,var(--bg),#eef5f5);color:var(--text);font-family:Tahoma,Arial,sans-serif;transition:background .35s,color .25s;overflow-x:hidden}body.dark{background:radial-gradient(circle at 8% 2%,#123a36 0,transparent 27%),radial-gradient(circle at 92% 8%,#3a2c0c 0,transparent 24%),#0b1418}.persian,.meanings,.meaning-tag,#meaning,.persian-text{font-family:'Vazirmatn',Tahoma,Arial,sans-serif}.meanings{line-height:1.9}.meaning-tag{font-weight:500;line-height:1.7}body:before,body:after{content:"";position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(70px);opacity:.14;pointer-events:none;z-index:-1}body:before{background:#14b8a6;top:35%;left:-130px}body:after{background:#f5b82e;bottom:-100px;right:-100px}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 0 7px #14b8a615}}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#0f766e55;border-radius:99px}::-webkit-scrollbar-thumb:hover{background:#0f766e99}.login-page{min-height:100vh;display:grid;place-items:center;padding:20px}.login-box{width:min(420px,100%);padding:40px;background:var(--glass);border:1px solid #ffffff55;border-radius:32px;text-align:center;box-shadow:0 25px 70px #164e4a20;backdrop-filter:blur(18px);animation:rise .5s ease}.logo{font-size:66px;filter:drop-shadow(0 10px 12px #0002);animation:float 3s ease-in-out infinite}.login-box h1{margin:8px 0;color:var(--primary);font-size:32px}.login-box p{color:var(--muted)}input,select{width:100%;padding:14px 16px;margin:6px 0;border:1px solid var(--border);border-radius:15px;background:var(--card);color:var(--text);font-size:15px;outline:none;transition:.2s}#meaning{font-size:16px}.login-box input{text-align:left;direction:ltr}input:focus,select:focus{border-color:var(--primary2);box-shadow:0 0 0 4px #14b8a61a;transform:translateY(-1px)}button{border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;cursor:pointer;font-weight:700;transition:transform .2s,box-shadow .2s,filter .2s}button:hover{filter:saturate(1.1);transform:translateY(-2px);box-shadow:0 7px 18px #0f766e30}button:active{transform:translateY(0)}button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}.login-box button{width:100%;margin-top:8px}.error{color:var(--danger)!important;min-height:20px}.app{display:none;padding:24px;max-width:1450px;margin:auto}.header{background:var(--glass);border:1px solid #ffffff35;border-radius:28px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:10;backdrop-filter:blur(18px)}.header:after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;background:linear-gradient(120deg,#ffffff18,transparent 45%)}.brand{display:flex;align-items:center;gap:14px;direction:ltr}.profile-group{display:flex;align-items:center}.profile-image{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--primary);box-shadow:0 5px 18px #0002}.brand-text{text-align:left}.brand-text h1{margin:0;color:var(--primary);font-size:25px;letter-spacing:.2px}.brand-text span{color:var(--muted);font-size:12px}.header-actions{display:flex;gap:8px;position:relative;z-index:1}.icon-btn{width:44px;height:44px;padding:0;font-size:19px}.quit{background:#334155}.hero{margin:22px 0;display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.hero-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b665f,#14b8a6);color:white;border-radius:27px;padding:27px;box-shadow:0 18px 45px #0f766e2b}.hero-card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff18;right:-55px;top:-65px}.hero-card:after{content:"✦";position:absolute;font-size:100px;opacity:.08;left:18px;bottom:-40px}.hero-card h2{position:relative;margin:0 0 8px;font-size:25px}.hero-card p{position:relative;margin:0;opacity:.92;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--glass);border:1px solid var(--border);border-radius:21px;padding:18px;box-shadow:var(--shadow);transition:.25s;display:flex;flex-direction:column;justify-content:center}.stat:hover{transform:translateY(-4px);border-color:#14b8a655}.stat strong{display:block;font-size:25px;color:var(--primary);margin-bottom:5px}.stat span{color:var(--muted);font-size:12px}.container{display:grid;grid-template-columns:350px 1fr;gap:20px}.card{background:var(--glass);border:1px solid var(--border);padding:22px;border-radius:27px;box-shadow:var(--shadow);backdrop-filter:blur(14px);animation:rise .35s ease}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.card h2{margin:0;font-size:19px}.add-btn{width:100%;margin-top:7px;font-size:15px;padding:13px}.sync-status{margin-top:12px;padding:11px 13px;border-radius:13px;font-size:12px;display:none}.sync-ok{background:#dff7ef;color:#087443}.sync-error{background:#ffe5e5;color:#a00000}.search-row{display:flex;gap:8px;align-items:center}.search-wrap{position:relative;flex:1}.search-wrap input{padding-left:45px}.clear-search{position:absolute;left:7px;top:11px;width:32px;height:32px;padding:0;background:transparent!important;color:var(--muted);font-size:21px;box-shadow:none!important}.clear-search:hover{color:var(--primary);transform:scale(1.15)}.list-meta{display:flex;justify-content:space-between;align-items:center;margin:10px 2px;color:var(--muted);font-size:12px}.word{background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid transparent;padding:17px;border-radius:20px;margin:12px 0;display:flex;gap:14px;align-items:flex-start;transition:.25s;animation:rise .25s ease}.word:hover{border-color:#14b8a655;transform:translateY(-3px);box-shadow:0 10px 28px #0f766e12}.word-content{flex:1;min-width:0}.word h3{color:var(--primary);margin:0 0 10px;font-size:18px;direction:ltr;text-align:left}.meanings{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}.meaning-tag{padding:7px 12px;border-radius:999px;background:linear-gradient(135deg,var(--primary),var(--primary2));font-size:12px;box-shadow:0 3px 8px #0f766e18}.meaning-tag:hover{background:linear-gradient(135deg,var(--gold),#e8b43c);color:white}.word-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.word-actions button{font-size:11px;padding:7px 10px}.danger{background:linear-gradient(135deg,#dc2626,#ef4444)}.order-controls{display:flex;gap:4px;margin-right:auto}.move-btn{width:38px;height:34px;padding:0;font-size:17px!important}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.empty .big{font-size:45px;margin-bottom:8px;animation:float 3s ease-in-out infinite}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#17323a;color:white;padding:12px 19px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:100;box-shadow:0 10px 30px #0004;backdrop-filter:blur(10px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:900px){.hero{grid-template-columns:1fr}.container{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.app{padding:12px}.header{top:6px;padding:12px;border-radius:22px}.brand-text h1{font-size:20px}.brand-text span{display:none}.profile-image{width:48px;height:48px}.hero{margin:15px 0}.hero-card{padding:20px;border-radius:22px}.hero-card h2{font-size:21px}.stats{gap:7px}.stat{padding:12px;text-align:center;border-radius:17px}.stat strong{font-size:20px}.card{padding:16px;border-radius:22px}.word{padding:13px;border-radius:17px}.order-controls{width:100%;margin-right:0}.move-btn{flex:1}.header-actions .quit{font-size:0;width:44px}.header-actions .quit:after{content:'↪';font-size:18px}}
</style></head>
<body>
<div class="login-page" id="login"><div class="login-box"><div class="logo">📚</div><h1>Star Dictionary</h1><p>Your personal English dictionary</p><input id="password" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Enter Dictionary</button><p class="error" id="error"></p></div></div>
<div class="app" id="app"><header class="header"><div class="brand"><div class="profile-group"><img class="profile-image" src="https://raw.githubusercontent.com/stars1392/star-dictionary/main/2013%20%282%29.jpg" onerror="this.style.display='none'"><img class="profile-image" src="https://raw.githubusercontent.com/stars1392/star-dictionary/refs/heads/main/d2bfc5ab-e07e-469c-b394-388fe37dfec3.jpg" onerror="this.style.display='none'"></div><div class="brand-text"><h1>Star Dictionary</h1><span>Learn • Save • Remember</span></div></div><div class="header-actions"><button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Dark mode">🌙</button><button class="quit" onclick="logout()">Quit</button></div></header>
<section class="hero"><div class="hero-card"><h2>📖 Welcome to your dictionary</h2><p>Build your vocabulary and keep every word synced across your devices.</p></div><div class="stats"><div class="stat"><strong id="wordCount">0</strong><span>Words</span></div><div class="stat"><strong id="meaningCount">0</strong><span>Meanings</span></div><div class="stat"><strong id="syncCount">☁️</strong><span>Cloud</span></div></div></section>
<div class="container"><section class="card"><div class="card-title"><h2>➕ Add Word</h2></div><input id="word" placeholder="English word" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('meaning').focus()}"><input id="meaning" placeholder="Meanings — use commas to separate" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addWord()}"><button class="add-btn" onclick="addWord()">＋ Add Word</button><div id="syncStatus" class="sync-status"></div></section>
<section class="card"><div class="card-title"><h2>🔎 Dictionary</h2><select id="sort" onchange="sortWords()" style="width:auto;margin:0"><option value="custom">Custom order</option><option value="alpha">A to Z</option><option value="new">Newest</option></select></div><div class="search-row"><div class="search-wrap"><input id="search" placeholder="Search word, meaning or number..." autocomplete="off" oninput="searchWord()"><button class="clear-search" onclick="clearSearch()">×</button></div></div><div class="list-meta"><span id="resultCount">0 results</span><span>☁️ Synced</span></div><div id="list"></div></section></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://cbaetwvmgfvyibzkwznb.supabase.co",SUPABASE_KEY="sb_publishable_hdoHhkqy-GMXC2wzjXdiaA_XSObSmTX",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let dictionary=[],localWords=JSON.parse(localStorage.getItem("dictionary")||"[]");
function normalize(x){return{id:x.id,word:String(x.word||"").trim(),meanings:[...new Set((Array.isArray(x.meanings)?x.meanings:[x.meanings||""]).flatMap(m=>String(m).split(/[,،]/).map(v=>v.trim()).filter(Boolean)))],date:Number(x.date)||Date.now()}}
function setStatus(m,type){let e=document.getElementById("syncStatus");e.textContent=m;e.className="sync-status "+(type==="error"?"sync-error":"sync-ok");e.style.display="block";document.getElementById("syncCount").textContent=type==="error"?"⚠️":"✓"}
function toast(m){let e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function updateStats(data=dictionary){document.getElementById("wordCount").textContent=dictionary.length;document.getElementById("meaningCount").textContent=dictionary.reduce((n,x)=>n+x.meanings.length,0);document.getElementById("resultCount").textContent=data.length+" result"+(data.length!==1?"s":"")}
async function loadWords(){setStatus("☁️ Connecting to cloud...","ok");let r=await supabaseClient.from("dictionary").select("id,word,meanings,date");if(r.error){dictionary=[];showWords();setStatus("Cloud sync error: "+r.error.message,"error");return}let cloud=(r.data||[]).map(normalize).sort((a,b)=>a.date-b.date);if(!cloud.length&&localWords.length){setStatus("☁️ Saving existing words to cloud...","ok");for(const x of localWords.map(normalize).filter(x=>x.word&&x.meanings.length)){let ins=await supabaseClient.from("dictionary").insert({word:x.word,meanings:x.meanings,date:x.date||Date.now()});if(ins.error){setStatus("Could not save: "+ins.error.message,"error");return}}r=await supabaseClient.from("dictionary").select("id,word,meanings,date");cloud=(r.data||[]).map(normalize).sort((a,b)=>a.date-b.date);toast("Your words are now in the cloud ✓")}dictionary=cloud;localStorage.setItem("dictionary",JSON.stringify(dictionary));localWords=dictionary.slice();setStatus("✓ Synced with Supabase — "+dictionary.length+" words","ok");showWords()}
async function login(){if(document.getElementById("password").value==="stars1392"){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";await loadWords();document.getElementById("word").focus()}else document.getElementById("error").textContent="Incorrect password"}
function logout(){location.reload()}
async function addWord(){let word=document.getElementById("word").value.trim(),meaning=document.getElementById("meaning").value.trim();if(!word||!meaning){toast("Enter a word and meaning");return}let meanings=meaning.split(/[,،]/).map(m=>m.trim()).filter(Boolean),old=dictionary.find(x=>x.word.toLowerCase()===word.toLowerCase());if(old){let merged=[...new Set([...old.meanings,...meanings])],r=await supabaseClient.from("dictionary").update({meanings:merged}).eq("id",old.id);if(r.error){toast(r.error.message);return}else toast("Meaning added ✓")}else{let last=dictionary.length?Math.max(...dictionary.map(x=>x.date||0)):0,r=await supabaseClient.from("dictionary").insert({word,meanings:[...new Set(meanings)],date:Math.max(Date.now(),last+1)});if(r.error){toast(r.error.message);return}else toast("Word added ✓")}document.getElementById("word").value="";document.getElementById("meaning").value="";await loadWords();document.getElementById("word").focus()}
function showWords(data=dictionary){let list=document.getElementById("list");list.innerHTML="";updateStats(data);if(!data.length){list.innerHTML='<div class="empty"><div class="big">📚</div><b>No words found</b><br>Try another search or add a new word.</div>';return}data.forEach(item=>{let i=dictionary.indexOf(item),tags=item.meanings.map(m=>`<button class="meaning-tag" data-meaning="${escapeAttr(m)}" onclick="searchMeaning(this.dataset.meaning)">${escapeHtml(m)}</button>`).join(""),up=i>0,down=i<dictionary.length-1;list.innerHTML+=`<article class="word"><div class="word-content"><h3>${i+1} — ${escapeHtml(item.word)}</h3><div class="meanings">${tags}</div><div class="word-actions"><button onclick="editWord(${i})">✏️ Edit</button><button class="danger" onclick="deleteWord(${i})">🗑 Delete</button><div class="order-controls"><button class="move-btn" ${up?"":"disabled"} onclick="moveWord(${i},-1)">▲</button><button class="move-btn" ${down?"":"disabled"} onclick="moveWord(${i},1)">▼</button></div></div></div></article>`})}
function searchMeaning(m){document.getElementById("search").value=m.trim();searchWord();document.getElementById("search").focus()}function searchWord(){let t=document.getElementById("search").value.trim().toLowerCase();showWords(!t?dictionary:dictionary.filter((x,i)=>String(i+1)===t||x.word.toLowerCase().includes(t)||x.meanings.some(m=>m.toLowerCase().includes(t))))}function clearSearch(){document.getElementById("search").value="";searchWord();document.getElementById("search").focus()}
async function deleteWord(i){if(!confirm('Delete “'+dictionary[i].word+'” from all devices?'))return;let r=await supabaseClient.from("dictionary").delete().eq("id",dictionary[i].id);if(r.error){toast(r.error.message);return}toast("Word deleted");await loadWords()}
async function editWord(i){let x=dictionary[i],nw=prompt("New word name:",x.word);if(nw===null)return;nw=nw.trim();if(!nw)return;let nm=prompt("Meanings — separate with commas:",x.meanings.join(", "));if(nm===null)return;let meanings=[...new Set(nm.split(/[,،]/).map(m=>m.trim()).filter(Boolean))];if(!meanings.length)return;let r=await supabaseClient.from("dictionary").update({word:nw,meanings}).eq("id",x.id);if(r.error){toast(r.error.message);return}toast("Word updated ✓");await loadWords()}
function sortWords(){let t=document.getElementById("sort").value;if(t==="alpha")dictionary.sort((a,b)=>a.word.localeCompare(b.word));else if(t==="new")dictionary.sort((a,b)=>b.date-a.date);else dictionary.sort((a,b)=>a.date-b.date);showWords()}
async function moveWord(i,d){let j=i+d;if(j<0||j>=dictionary.length)return;let a=dictionary[i],b=dictionary[j],temp=a.date;a.date=b.date;b.date=temp;let r1=await supabaseClient.from("dictionary").update({date:a.date}).eq("id",a.id),r2=await supabaseClient.from("dictionary").update({date:b.date}).eq("id",b.id);if(r1.error||r2.error){toast((r1.error||r2.error).message);await loadWords();return}document.getElementById("sort").value="custom";await loadWords();toast("Order updated ✓")}
function toggleTheme(){document.body.classList.toggle("dark");let dark=document.body.classList.contains("dark");localStorage.setItem("theme",dark?"dark":"light");document.getElementById("themeBtn").textContent=dark?"☀️":"🌙"}function initTheme(){if(localStorage.getItem("theme")==="dark"){document.body.classList.add("dark");document.getElementById("themeBtn").textContent="☀️"}}
function escapeHtml(t){let d=document.createElement("div");d.textContent=t;return d.innerHTML}function escapeAttr(t){return String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}initTheme();
</script><script src="./access-mode.js"></script></body></html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Dictionary</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f9d423,#ffcc00)}
.login-page{height:100vh;display:flex;justify-content:center;align-items:center}
.login-box{background:white;width:360px;padding:35px;border-radius:25px;text-align:center;box-shadow:0 20px 40px #0005}
.logo{font-size:55px}.login-box h1{color:#d89b00}
input,select{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #ddd;font-size:16px}
button{padding:11px 20px;border:0;border-radius:12px;background:#008f83;color:white;cursor:pointer;transition:.3s}
button:hover{background:#cc9900}.error{color:red}
#app{display:none;padding:25px}
.header{background:white;border-radius:25px;padding:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #0003}
.header-title{display:flex;align-items:center;gap:15px;direction:ltr}
.profile-image{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #008f83;box-shadow:0 4px 10px #0003;display:block}
.header h1{color:#008f83;margin:0}
.container{display:grid;grid-template-columns:350px 1fr;gap:20px;margin-top:25px}
.card{background:white;padding:25px;border-radius:25px;box-shadow:0 10px 25px #0003}
.word{background:#f5f6ff;padding:15px;border-radius:15px;margin:12px 0}.word h3{color:#008f83}
.meanings{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.meaning-tag{display:inline-flex;align-items:center;padding:7px 12px;border:0;border-radius:999px;background:#008f83;color:white;font-size:14px;cursor:pointer;transition:.2s}
.meaning-tag:hover{background:#cc9900;transform:translateY(-1px)}
.word button{font-size:12px;padding:7px 12px}
.empty{color:#777;text-align:center;padding:20px}
@media(max-width:800px){.container{grid-template-columns:1fr}.header{padding:15px}.profile-image{width:52px;height:52px}.header h1{font-size:24px}}
</style>
</head>
<body>
<div class="login-page" id="login">
<div class="login-box">
<div class="logo">📚</div><h1>Star Dictionary</h1><p>Enter Dictionary</p>
<input id="password" type="password" placeholder="password" onkeydown="if(event.key==='Enter') login()">
<button onclick="login()">Enter</button><p class="error" id="error"></p>
</div></div>
<div id="app">
<div class="header">
<div class="header-title">
<img class="profile-image" src="https://raw.githubusercontent.com/stars1392/star-dictionary/main/2013%20%282%29.jpg" alt="Profile" onerror="this.style.display='none'">
<h1>📖 Star Dictionary</h1>
</div><button onclick="logout()">Quit</button>
</div>
<div class="container">
<div class="card"><h2>➕ Add word</h2><input id="word" placeholder="English"><input id="meaning" placeholder="Meaning"><button onclick="addWord()">Add</button></div>
<div class="card"><h2>🔍 search</h2><input id="search" placeholder="search ..." oninput="searchWord()"><select id="sort" onchange="sortWords()"><option value="alpha">A to Z</option><option value="new">Date modified</option></select><div id="list"></div></div>
</div></div>
<script>
const savedDictionary=JSON.parse(localStorage.getItem("dictionary")||"null");
let dictionary=savedDictionary||[{word:"book",meanings:["کتاب","دفتر"],date:1},{word:"computer",meanings:["کامپیوتر","رایانه"],date:2},{word:"football",meanings:["فوتبال"],date:3}];

dictionary=dictionary.map(item=>({
 word:String(item.word||"").trim(),
 meanings:[...new Set((Array.isArray(item.meanings)?item.meanings:[item.meanings||""]).flatMap(m=>String(m).split(/[,،]/).map(x=>x.trim()).filter(Boolean)))],
 date:item.date||Date.now()
}));
localStorage.setItem("dictionary",JSON.stringify(dictionary));

function login(){let pass=document.getElementById("password").value;if(pass==="stars1392"){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";showWords()}else document.getElementById("error").innerHTML="password incorrect"}
function logout(){location.reload()}
function save(){localStorage.setItem("dictionary",JSON.stringify(dictionary))}
function addWord(){let word=document.getElementById("word").value.trim(),meaning=document.getElementById("meaning").value.trim();if(word===""||meaning===""){alert("Enter word and meaning");return}let meanings=meaning.split(/[,،]/).map(m=>m.trim()).filter(Boolean);let old=dictionary.find(x=>x.word.toLowerCase()===word.toLowerCase());if(old){meanings.forEach(m=>{if(!old.meanings.some(x=>x.toLowerCase()===m.toLowerCase()))old.meanings.push(m)})}else dictionary.push({word:word,meanings:[...new Set(meanings)],date:Date.now()});save();showWords();document.getElementById("word").value="";document.getElementById("meaning").value=""}
function showWords(data=dictionary){let list=document.getElementById("list");list.innerHTML="";if(!data.length){list.innerHTML='<div class="empty">No results found</div>';return}data.forEach(item=>{let originalIndex=dictionary.indexOf(item);let tags=item.meanings.map(meaning=>`<button type="button" class="meaning-tag" data-meaning="${escapeAttr(meaning)}" onclick="searchMeaning(this.dataset.meaning)">${escapeHtml(meaning.trim())}</button>`).join("");list.innerHTML+=`<div class="word"><h3>${originalIndex+1} - ${escapeHtml(item.word)}</h3><div class="meanings">${tags}</div><button onclick="editWord(${originalIndex})">✏️ edit</button><button onclick="deleteWord(${originalIndex})">🗑 Delete</button></div>`})}
function searchMeaning(meaning){let searchBox=document.getElementById("search");searchBox.value=meaning.trim();searchWord();searchBox.focus()}
function searchWord(){let text=document.getElementById("search").value.trim().toLowerCase();showWords(dictionary.filter(item=>item.word.toLowerCase().includes(text)||item.meanings.some(m=>m.toLowerCase().includes(text))))}
function deleteWord(index){if(confirm("Delete?")){dictionary.splice(index,1);save();showWords()}}
function editWord(index){let item=dictionary[index],newWord=prompt("New word name:",item.word);if(newWord===null)return;let newMeanings=prompt("Separate the meanings with comma:",item.meanings.join(", "));if(newMeanings===null)return;let meanings=newMeanings.split(/[,،]/).map(m=>m.trim()).filter(Boolean);dictionary[index]={word:newWord.trim(),meanings:[...new Set(meanings)],date:Date.now()};save();showWords()}
function sortWords(){let type=document.getElementById("sort").value;if(type==="alpha")dictionary.sort((a,b)=>a.word.localeCompare(b.word));else dictionary.sort((a,b)=>b.date-a.date);save();showWords()}
function escapeHtml(text){let div=document.createElement("div");div.textContent=text;return div.innerHTML}
function escapeAttr(text){return String(text).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Star Dictionary</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f9d423,#ffcc00)}.login-page{height:100vh;display:flex;justify-content:center;align-items:center}.login-box{background:white;width:360px;padding:35px;border-radius:25px;text-align:center;box-shadow:0 20px 40px #0005}.logo{font-size:55px}.login-box h1{color:#d89b00}input,select{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #ddd;font-size:16px}button{padding:11px 20px;border:0;border-radius:12px;background:#008f83;color:white;cursor:pointer;transition:.3s}button:hover{background:#cc9900}.error{color:red}.sync-status{margin:10px 0;padding:10px;border-radius:10px;font-size:13px;display:none}.sync-ok{background:#d9f7e9;color:#087443}.sync-error{background:#ffe0e0;color:#a00000}#app{display:none;padding:25px}.header{background:white;border-radius:25px;padding:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #0003}.header-title{display:flex;align-items:center;gap:15px;direction:ltr}.profile-group{display:flex;align-items:center;gap:10px;flex-shrink:0}.profile-image{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #008f83;box-shadow:0 4px 10px #0003}.header h1{color:#008f83;margin:0}.container{display:grid;grid-template-columns:350px 1fr;gap:20px;margin-top:25px}.card{background:white;padding:25px;border-radius:25px;box-shadow:0 10px 25px #0003}.word{background:#f5f6ff;padding:15px;border-radius:15px;margin:12px 0;display:flex;align-items:flex-end;gap:14px}.word-content{flex:1;min-width:0}.word h3{color:#008f83;margin:0 0 8px}.meanings{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.meaning-tag{display:inline-flex;align-items:center;padding:7px 12px;border:0;border-radius:999px;background:#008f83;color:white;font-size:14px;cursor:pointer}.meaning-tag:hover{background:#cc9900}.word-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.word button{font-size:12px;padding:7px 12px;margin:2px}.order-controls{display:flex;flex-direction:row;gap:4px;flex-shrink:0;align-items:center;margin:0}.move-btn{width:40px;height:38px;padding:0!important;border-radius:11px;background:#008f83;font-size:19px!important;box-shadow:0 3px 8px #0002}.move-btn:hover{background:#cc9900;transform:scale(1.06)}.move-btn:disabled{opacity:.35;cursor:not-allowed}.empty{color:#777;text-align:center;padding:20px}@media(max-width:800px){.container{grid-template-columns:1fr}.header{padding:15px}.profile-image{width:60px;height:60px}.header h1{font-size:24px}.move-btn{width:40px;height:37px}}
</style></head>
<body>
<div class="login-page" id="login"><div class="login-box"><div class="logo">📚</div><h1>Star Dictionary</h1><p>Enter Dictionary</p><input id="password" type="password" placeholder="password" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Enter</button><p class="error" id="error"></p></div></div>
<div id="app"><div class="header"><div class="header-title"><div class="profile-group"><img class="profile-image" src="https://raw.githubusercontent.com/stars1392/star-dictionary/main/2013%20%282%29.jpg" onerror="this.style.display='none'"><img class="profile-image" src="https://raw.githubusercontent.com/stars1392/star-dictionary/refs/heads/main/d2bfc5ab-e07e-469c-b394-388fe37dfec3.jpg" onerror="this.style.display='none'"></div><h1>📖 Star Dictionary</h1></div><button onclick="logout()">Quit</button></div>
<div class="container"><div class="card"><h2>➕ Add word</h2><input id="word" placeholder="English" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('meaning').focus()}"><input id="meaning" placeholder="Meaning" onkeydown="if(event.key==='Enter'){event.preventDefault();addWord()}"><button onclick="addWord()">Add</button><div id="syncStatus" class="sync-status"></div></div><div class="card"><h2>🔍 search</h2><input id="search" placeholder="search ..." oninput="searchWord()"><select id="sort" onchange="sortWords()"><option value="custom">Custom order</option><option value="alpha">A to Z</option><option value="new">Date added</option></select><div id="list"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://cbaetwvmgfvyibzkwznb.supabase.co";const SUPABASE_KEY="sb_publishable_hdoHhkqy-GMXC2wzjXdiaA_XSObSmTX";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let dictionary=[];
let localWords=JSON.parse(localStorage.getItem("dictionary")||"[]");
function normalize(x){return{id:x.id,word:String(x.word||"").trim(),meanings:[...new Set((Array.isArray(x.meanings)?x.meanings:[x.meanings||""]).flatMap(m=>String(m).split(/[,،]/).map(v=>v.trim()).filter(Boolean)))],date:Number(x.date)||Date.now()}}
function setStatus(message,type){const el=document.getElementById("syncStatus");el.textContent=message;el.className="sync-status "+(type==="error"?"sync-error":"sync-ok");el.style.display="block"}
async function loadWords(){
  setStatus("Connecting to cloud...","ok");
  const result=await supabaseClient.from("dictionary").select("id,word,meanings,date");
  if(result.error){
    console.error(result.error);dictionary=[];showWords();setStatus("Cloud sync error: "+result.error.message,"error");return;
  }
  let cloudWords=(result.data||[]).map(normalize).sort((a,b)=>a.date-b.date);
  if(cloudWords.length===0 && localWords.length>0){
    setStatus("Saving your existing words to the cloud...","ok");
    const clean=localWords.map(normalize).filter(x=>x.word&&x.meanings.length);
    for(const x of clean){
      const payload={word:x.word,meanings:x.meanings,date:x.date||Date.now()};
      const ins=await supabaseClient.from("dictionary").insert(payload);
      if(ins.error){console.error(ins.error);dictionary=[];showWords();setStatus("Could not save to Supabase: "+ins.error.message,"error");return;}
    }
    const again=await supabaseClient.from("dictionary").select("id,word,meanings,date");
    if(again.error){setStatus("Cloud verification error: "+again.error.message,"error");return;}
    cloudWords=(again.data||[]).map(normalize).sort((a,b)=>a.date-b.date);setStatus("✓ Your existing words were synced to Supabase.","ok");
  }else setStatus("✓ Synced with Supabase — "+cloudWords.length+" words","ok");
  dictionary=cloudWords;localStorage.setItem("dictionary",JSON.stringify(dictionary));localWords=dictionary.slice();showWords();
}
async function login(){if(document.getElementById("password").value==="stars1392"){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";await loadWords()}else document.getElementById("error").innerHTML="password incorrect"}
function logout(){location.reload()}
async function addWord(){
  let word=document.getElementById("word").value.trim(),meaning=document.getElementById("meaning").value.trim();if(!word||!meaning){alert("Enter word and meaning");return}
  let meanings=meaning.split(/[,،]/).map(m=>m.trim()).filter(Boolean),old=dictionary.find(x=>x.word.toLowerCase()===word.toLowerCase());
  if(old){let merged=[...new Set([...old.meanings,...meanings])];let r=await supabaseClient.from("dictionary").update({meanings:merged}).eq("id",old.id);if(r.error){alert("Supabase error: "+r.error.message);return}}
  else{let lastDate=dictionary.length?Math.max(...dictionary.map(x=>x.date||0)):0,newDate=Math.max(Date.now(),lastDate+1);let r=await supabaseClient.from("dictionary").insert({word,meanings:[...new Set(meanings)],date:newDate}).select("id,word,meanings,date").single();if(r.error){alert("Supabase error: "+r.error.message);return}}
  document.getElementById("word").value="";document.getElementById("meaning").value="";await loadWords();document.getElementById("word").focus()
}
function showWords(data=dictionary){let list=document.getElementById("list");list.innerHTML="";if(!data.length){list.innerHTML='<div class="empty">No results found</div>';return}data.forEach(item=>{let i=dictionary.indexOf(item),tags=item.meanings.map(m=>`<button type="button" class="meaning-tag" data-meaning="${escapeAttr(m)}" onclick="searchMeaning(this.dataset.meaning)">${escapeHtml(m)}</button>`).join(""),up=i>0,down=i<dictionary.length-1;list.innerHTML+=`<div class="word"><div class="word-content"><h3>${i+1} - ${escapeHtml(item.word)}</h3><div class="meanings">${tags}</div><div class="word-actions"><button onclick="editWord(${i})">✏️ edit</button><button onclick="deleteWord(${i})">🗑 Delete</button><div class="order-controls"><button class="move-btn" ${up?"":"disabled"} onclick="moveWord(${i},-1)">▲</button><button class="move-btn" ${down?"":"disabled"} onclick="moveWord(${i},1)">▼</button></div></div></div></div>`})}
function searchMeaning(m){document.getElementById("search").value=m.trim();searchWord();document.getElementById("search").focus()}
function searchWord(){let t=document.getElementById("search").value.trim().toLowerCase();showWords(!t?dictionary:dictionary.filter((x,i)=>String(i+1)===t||x.word.toLowerCase().includes(t)||x.meanings.some(m=>m.toLowerCase().includes(t))))}
async function deleteWord(i){if(!confirm("Delete?"))return;let r=await supabaseClient.from("dictionary").delete().eq("id",dictionary[i].id);if(r.error){alert(r.error.message);return}await loadWords()}
async function editWord(i){let item=dictionary[i],nw=prompt("New word name:",item.word);if(nw===null)return;let nm=prompt("Separate the meanings with comma:",item.meanings.join(", "));if(nm===null)return;let meanings=nm.split(/[,،]/).map(m=>m.trim()).filter(Boolean),r=await supabaseClient.from("dictionary").update({word:nw.trim(),meanings:[...new Set(meanings)]}).eq("id",item.id);if(r.error){alert(r.error.message);return}await loadWords()}
function sortWords(){let t=document.getElementById("sort").value;if(t==="alpha")dictionary.sort((a,b)=>a.word.localeCompare(b.word));else if(t==="new")dictionary.sort((a,b)=>b.date-a.date);else dictionary.sort((a,b)=>a.date-b.date);showWords()}
async function moveWord(i,d){let j=i+d;if(j<0||j>=dictionary.length)return;let a=dictionary[i],b=dictionary[j],temp=a.date;a.date=b.date;b.date=temp;let r1=await supabaseClient.from("dictionary").update({date:a.date}).eq("id",a.id),r2=await supabaseClient.from("dictionary").update({date:b.date}).eq("id",b.id);if(r1.error||r2.error){alert((r1.error||r2.error).message);await loadWords();return}dictionary.sort((x,y)=>x.date-y.date);document.getElementById("sort").value="custom";await loadWords()}
function escapeHtml(t){let d=document.createElement("div");d.textContent=t;return d.innerHTML}function escapeAttr(t){return String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
</script></body></html>
